name: Cloud Scalper

on:
  schedule:
    # 提前 10 分钟触发，以抵消 GitHub Actions 的启动延迟 (Jitter)
    # 均为 UTC 时间 (比北京时间晚 8 小时)
    - cron: '20 7 * * *'  # 对应北京时间 15:30，提前到 15:20 触发
    - cron: '5 12 * * *'  # 对应北京时间 20:15，提前到 20:05 触发
    - cron: '20 13 * * *' # 对应北京时间 21:30，提前到 21:20 触发
    - cron: '5 0 * * *'   # 对应北京时间 08:15，提前到 08:05 触发
  workflow_dispatch:      # 允许在网页上手动点击运行测试

jobs:
  run-scalper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance

      - name: Determine Target Time
        id: set_time
        run: |
          # 根据触发的 cron 表达式，设置真正的目标倒计时时间
          CRON="${{ github.event.schedule }}"
          if [ "$CRON" == "20 7 * * *" ]; then
            echo "TARGET_TIME=15:30:00" >> $GITHUB_ENV
          elif [ "$CRON" == "5 12 * * *" ]; then
            echo "TARGET_TIME=20:15:00" >> $GITHUB_ENV
          elif [ "$CRON" == "20 13 * * *" ]; then
            echo "TARGET_TIME=21:30:00" >> $GITHUB_ENV
          elif [ "$CRON" == "5 0 * * *" ]; then
            echo "TARGET_TIME=08:15:00" >> $GITHUB_ENV
          else
            # 默认或手动触发时为空
            echo "TARGET_TIME=" >> $GITHUB_ENV
          fi

      - name: Run Cloud Scalper
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python cloud_scalper.py
